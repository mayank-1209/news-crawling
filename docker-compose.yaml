version: "3.9"

services:
  web:
    build: .
    container_name: web-scraper
    volumes:
      # Maps the EC2 server's physical folder to the container's static folder
      - ./server_media:/app/static/media
    restart: unless-stopped
    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: scraper_db
      MYSQL_USER: scraper_user
      MYSQL_PASSWORD: scraper_pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"


volumes:
  mysql_data: